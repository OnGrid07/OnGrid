<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<title>OnGrid</title>
<style>
  /* OnGrid launcher: a gate ring. Each symbol on the ring opens one box in its own window; the centre opens the full page.
     The window is transparent and has no frame: drag the ring anywhere (even on a symbol) to move it; a click without moving opens. */
  :root { color-scheme: dark; --accent: #4fb3d9; --fg: #d6e1ea; --muted: #7d8fa0; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; font-family: "Segoe UI", system-ui, sans-serif; }
  .gate { position: absolute; inset: 10px; border-radius: 50%; cursor: grab; }
  body.dragging, body.dragging * { cursor: grabbing !important; }
  .gate svg.ring { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  :root { --s: 1; } /* the ring's scale (its window can be small, medium or large) */
  .sym { position: absolute; width: calc(46px * var(--s)); height: calc(46px * var(--s)); margin: calc(-23px * var(--s)) 0 0 calc(-23px * var(--s)); border-radius: 50%; border: 0; padding: 0; background: transparent; cursor: pointer; display: grid; place-items: center; transition: transform .15s, filter .15s; }
  .sym svg { width: calc(26px * var(--s)); height: calc(26px * var(--s)); fill: none; stroke: #e8eef3; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 2px rgba(0,0,0,.9)); }
  .sym:hover, .sym:focus-visible { transform: scale(1.22); filter: drop-shadow(0 0 6px var(--accent)); outline: none; }
  .sym:hover svg, .sym:focus-visible svg { stroke: #fff; }
  .sym.open::after { content: ""; position: absolute; bottom: 1px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 6px var(--accent); }
  .core { position: absolute; left: 50%; top: 50%; width: 66.5%; height: 66.5%; transform: translate(-50%, -50%); border-radius: 50%; border: 0; cursor: pointer;
    background: radial-gradient(circle at 50% 50%, rgba(79,179,217,.55) 0%, rgba(40,110,160,.45) 35%, rgba(12,30,48,.75) 68%, rgba(8,14,22,.92) 100%); box-shadow: inset 0 0 40px rgba(79,179,217,.35); overflow: hidden; }
  .core::before, .core::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(160,220,245,.35); animation: ripple 4s ease-out infinite; }
  .core::after { animation-delay: 2s; }
  @keyframes ripple { 0% { transform: scale(.15); opacity: 0; } 30% { opacity: .9; } 100% { transform: scale(1); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .core::before, .core::after { animation: none; opacity: 0; } }
  .core:hover { box-shadow: inset 0 0 60px rgba(120,210,245,.6); }
  .label { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); text-align: center; pointer-events: none; color: var(--fg); text-shadow: 0 0 8px #000, 0 0 3px #000; }
  .label b { display: block; font: 600 calc(22px * var(--s)) "Segoe UI", system-ui, sans-serif; letter-spacing: .06em; }
  .label span { display: block; font-size: max(10px, calc(12px * var(--s))); color: #bfe6f6; margin-top: 2px; min-height: 1.2em; }
  .hide { position: absolute; left: 50%; bottom: 4px; transform: translateX(-50%); font: 11px "Segoe UI", sans-serif; color: var(--muted); background: rgba(11,15,20,.85); border: 1px solid #1f2a36; border-radius: 10px; padding: 1px 9px; cursor: pointer; }
  .hide:hover { color: var(--fg); border-color: var(--accent); }
</style>
</head>
<body>
<div class="gate" id="gate">
  <svg class="ring" viewBox="0 0 400 400" aria-hidden="true">
    <defs>
      <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b4a5c"/><stop offset=".45" stop-color="#1b2633"/><stop offset="1" stop-color="#2a3646"/></linearGradient>
      <radialGradient id="band" cx="50%" cy="50%" r="50%"><stop offset=".7" stop-color="#111a24"/><stop offset=".86" stop-color="#1a2532"/><stop offset="1" stop-color="#0b1118"/></radialGradient>
    </defs>
    <!-- outer and inner rims, the band the symbols sit in, and fine markings -->
    <circle cx="200" cy="200" r="197" fill="url(#metal)" stroke="#0b0f14" stroke-width="2"/>
    <circle cx="200" cy="200" r="186" fill="url(#band)" stroke="#5d7085" stroke-width="1"/>
    <circle cx="200" cy="200" r="150" fill="none" stroke="#5d7085" stroke-width="1"/>
    <circle cx="200" cy="200" r="143" fill="url(#metal)" stroke="#0b0f14" stroke-width="1.5"/>
    <circle cx="200" cy="200" r="134" fill="#0b0f14" stroke="#4fb3d9" stroke-width="1.2" stroke-opacity=".6"/>
    <g id="ticks" stroke="#6f8399" stroke-width="1"></g>
    <g id="cells"></g>
    <g id="clamps"></g>
  </svg>
  <button class="core" id="core" title="Open the full OnGrid window" aria-label="Open the full OnGrid window"></button>
  <div class="label"><b>OnGrid</b><span id="what">Open everything</span></div>
  <div id="syms"></div>
</div>
<button class="hide" id="hide" title="Hide the launcher to the tray (right-click the tray icon to bring it back)">hide</button>
<script>
  // the boxes on the ring, clockwise from the top: [id, name, icon]
  const ITEMS = [
    ["mapPanel", "Gate map", '<path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/>'],
    ["specPanel", "Wormholes and sov fights", '<circle cx="12" cy="12" r="2"/><path d="M12 4a8 8 0 018 8M20 12a8 8 0 01-8 8M12 20a8 8 0 01-8-8M4 12a8 8 0 018-8" stroke-dasharray="7 3.5"/><path d="M12 7.5a4.5 4.5 0 014.5 4.5"/><path d="M7.5 12A4.5 4.5 0 0012 16.5"/>'],
    ["intelPanel", "Intel and location", '<circle cx="12" cy="12" r="1.6"/><path d="M8.5 15.5a5 5 0 010-7M15.5 8.5a5 5 0 010 7M5.6 18.4a9 9 0 010-12.8M18.4 5.6a9 9 0 010 12.8"/>'],
    ["scanPanel", "Local and D-scan", '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><path d="M12 12l6.4-6.4"/><circle cx="16" cy="9" r="1" fill="#e8eef3"/>'],
    ["hostilePanel", "Hostile tracker", '<circle cx="12" cy="12" r="7"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/><circle cx="12" cy="12" r="1.5"/>'],
    ["watchPanel", "Watched systems", '<path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'],
    ["sysPanel", "Systems", '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M3 14h18M9 4v16"/>'],
    ["killPanel", "Kills", '<path d="M12 2l1.8 5.2L19 5l-2.6 4.8L22 12l-5.6 2.2L19 19l-5.2-2.2L12 22l-1.8-5.2L5 19l2.6-4.8L2 12l5.6-2.2L5 5l5.2 2.2z"/>'],
    ["notifPanel", "Character notifications", '<path d="M6 16V11a6 6 0 0112 0v5l2 2H4z"/><path d="M10 20a2 2 0 004 0"/>'],
    ["timerPanel", "Timers", '<circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6"/>'],
    ["routePanel", "Route planner", '<circle cx="5" cy="18" r="2"/><circle cx="19" cy="6" r="2"/><path d="M7 18h6a3 3 0 000-6H11a3 3 0 010-6h6"/>'],
    ["settings", "Alerts and settings", '<circle cx="12" cy="12" r="2.6"/><circle cx="12" cy="12" r="6.2"/><path stroke-width="3.2" stroke-linecap="butt" d="M12 3.2v2.6M12 18.2v2.6M3.2 12h2.6M18.2 12h2.6M5.8 5.8l1.8 1.8M16.4 16.4l1.8 1.8M5.8 18.2l1.8-1.8M16.4 7.6l1.8-1.8"/>'],
    ["about", "About", '<circle cx="12" cy="12" r="9"/><path d="M12 11v6"/><circle cx="12" cy="7.5" r=".6" fill="#e8eef3"/>'],
    ["quit", "Quit OnGrid", '<path d="M12 3v9"/><path d="M6.3 6.3a8 8 0 1011.4 0"/>']
  ];
  const N = ITEMS.length, C = 200, R = 168, ns = "http://www.w3.org/2000/svg";
  const at = (a, r) => [C + Math.cos(a) * r, C + Math.sin(a) * r];
  const ang = i => -Math.PI / 2 + i * 2 * Math.PI / N;
  // fine tick marks on both rims
  let t = ""; for (let i = 0; i < 120; i++) { const a = i * Math.PI / 60, l = i % 5 ? 3 : 6, [x1, y1] = at(a, 186), [x2, y2] = at(a, 186 - l), [x3, y3] = at(a, 150), [x4, y4] = at(a, 150 + l / 2);
    t += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><line x1="${x3}" y1="${y3}" x2="${x4}" y2="${y4}"/>`; }
  document.getElementById("ticks").innerHTML = t;
  // a cell for each symbol, separated by dividers, and a clamp on the outer rim at each divider
  let cells = "", clamps = "";
  for (let i = 0; i < N; i++) {
    const a = ang(i) + Math.PI / N, [x1, y1] = at(a, 152), [x2, y2] = at(a, 184);
    cells += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#5d7085" stroke-width="1.2"/>`;
    const w = 0.055, [p1x, p1y] = at(a - w, 199), [p2x, p2y] = at(a + w, 199), [p3x, p3y] = at(a + w * 0.55, 182), [p4x, p4y] = at(a - w * 0.55, 182);
    clamps += `<path d="M${p1x},${p1y} L${p2x},${p2y} L${p3x},${p3y} L${p4x},${p4y}Z" fill="#2d3a4a" stroke="#0b0f14" stroke-width="1"/><circle cx="${at(a, 191)[0]}" cy="${at(a, 191)[1]}" r="1.8" fill="#4fb3d9" opacity=".8"/>`;
  }
  document.getElementById("cells").innerHTML = cells; document.getElementById("clamps").innerHTML = clamps;
  const what = document.getElementById("what"), box = document.getElementById("gate");
  // positions are in ring units (400 across); the symbols' size is relative to the large ring
  const place = () => { const s = box.clientWidth / 400; document.documentElement.style.setProperty("--s", (box.clientWidth / 440).toFixed(3)); document.querySelectorAll(".sym").forEach((b, i) => { const [x, y] = at(ang(i), R); b.style.left = x * s + "px"; b.style.top = y * s + "px"; }); };
  document.getElementById("syms").innerHTML = ITEMS.map(([id, name, icon]) => `<button class="sym" data-id="${id}" title="${name}" aria-label="${name}"><svg viewBox="0 0 24 24">${icon}</svg></button>`).join("");
  place(); addEventListener("resize", place);
  const api = window.ongrid || { open: () => {}, full: () => {}, quit: () => {}, hide: () => {}, onOpen: () => {}, dragStart: () => {}, dragMove: () => {}, dragEnd: () => {} };
  // moving the ring: press anywhere on it and drag. It only counts as a drag after 4 pixels, so clicks still work.
  let drag = null;
  document.getElementById("gate").addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    drag = { x: e.screenX, y: e.screenY, moved: false, id: e.pointerId };
  });
  document.getElementById("gate").addEventListener("pointermove", e => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.screenX - drag.x, dy = e.screenY - drag.y;
    if (!drag.moved) { if (Math.hypot(dx, dy) < 4) return; drag.moved = true; document.body.classList.add("dragging"); document.getElementById("gate").setPointerCapture(e.pointerId); api.dragStart(); } // capture only once it's really a drag, so plain clicks reach the symbols
    api.dragMove(Math.round(dx), Math.round(dy));
  });
  const endDrag = e => {
    if (!drag) return; const moved = drag.moved; drag = null; document.body.classList.remove("dragging");
    if (moved) { api.dragEnd(); quietUntil = Date.now() + 250; } // the drag isn't also a click
  };
  let quietUntil = 0;
  addEventListener("click", ev => { if (Date.now() < quietUntil) { ev.stopPropagation(); ev.preventDefault(); } }, true);
  document.getElementById("gate").addEventListener("pointerup", endDrag);
  document.getElementById("gate").addEventListener("pointercancel", endDrag);
  document.getElementById("syms").addEventListener("click", e => { const b = e.target.closest(".sym"); if (!b) return; b.dataset.id === "quit" ? api.quit() : api.open(b.dataset.id); });
  document.getElementById("syms").addEventListener("mouseover", e => { const b = e.target.closest(".sym"); if (b) what.textContent = b.title; });
  document.getElementById("syms").addEventListener("mouseout", () => what.textContent = "Open everything");
  document.getElementById("core").addEventListener("click", () => api.full());
  document.getElementById("hide").addEventListener("click", () => api.hide());
  addEventListener("keydown", e => { if (e.key === "Escape") api.hide(); });
  // a small dot under the symbols whose window is open
  api.onOpen(ids => document.querySelectorAll(".sym").forEach(b => b.classList.toggle("open", ids.includes(b.dataset.id))));
</script>
</body>
</html>
