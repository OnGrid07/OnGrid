<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OnGrid</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #0b0f14; color: #d6e1ea; font: 15px/1.5 "Segoe UI", system-ui, sans-serif; }
  main { max-width: 34em; padding: 24px; }
  h1 { font: 600 22px "Segoe UI", system-ui, sans-serif; margin: 0 0 8px; }
  p { color: #7d8fa0; margin: 0 0 16px; }
  button { font: 14px "Segoe UI", system-ui, sans-serif; background: #0b0f14; color: #4fb3d9; border: 1px solid #4fb3d9; border-radius: 4px; padding: 7px 14px; cursor: pointer; }
  button:hover { background: #4fb3d9; color: #0b0f14; }
  code { color: #7d8fa0; font-size: 12px; }
</style>
</head>
<body>
<main>
  <h1>Can't reach OnGrid</h1>
  <p>The app loads the page from the internet and couldn't connect. Check your connection; it tries again every 30 seconds.</p>
  <p><code id="why"></code></p>
  <button type="button" id="retry">Try again now</button>
</main>
<script>
  const q = new URLSearchParams(location.search), site = q.get("site");
  document.getElementById("why").textContent = q.get("reason") || "";
  const go = () => { if (site) location.href = site; };
  document.getElementById("retry").addEventListener("click", go);
  setInterval(go, 30000);
</script>
</body>
</html>
