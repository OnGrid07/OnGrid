<!doctype html>
<!--
  Forwarding page for the old address of OnGrid (formerly Local Intel):
  https://quietstatic01.github.io/Eve-Intel/  →  https://ongrid07.github.io/OnGrid/
  Upload this folder ("Eve-Intel/index.html") to a repository named quietstatic01.github.io in the
  quietstatic01 account, with GitHub Pages on. It forwards bookmarks and old share links, and carries the
  settings saved at the old address across (settings, presets, timers, intel channels, layout — never an
  EVE login), because browsers keep saved data per address.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OnGrid has moved</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b0f14; color: #d6e1ea; font: 16px/1.5 system-ui, "Segoe UI", sans-serif; }
  main { max-width: 32em; padding: 24px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #7d8fa0; margin: 0 0 14px; }
  a { color: #4fb3d9; }
</style>
</head>
<body>
<main>
  <h1>OnGrid has moved</h1>
  <p>Local Intel is now OnGrid, at <a id="go" href="https://ongrid07.github.io/OnGrid/">ongrid07.github.io/OnGrid</a>. Taking you there, with your settings…</p>
  <p>Please update your bookmark.</p>
</main>
<script>
  const NEW = "https://ongrid07.github.io/OnGrid/";
  const KEYS = ["settings", "presets", "timers", "intelChannels", "panels", "origin", "radius", "layout"];
  const items = {};
  try { for (const k of KEYS) { const v = localStorage.getItem(k); if (v != null) items[k] = v; } } catch {}
  const keep = location.hash; // share links (#scan=…, #s=…) and phone pairing (#pair=…)
  let url = NEW + location.search + keep;
  if (Object.keys(items).length && !/^#(scan|s)=/.test(keep)) {
    const data = { app: "local-intel", v: "moved", saved: new Date().toISOString(), items };
    const code = btoa(unescape(encodeURIComponent(JSON.stringify(data)))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
    url = NEW + location.search + "#import=" + code + (keep ? "&next=" + encodeURIComponent(keep) : "");
  }
  document.getElementById("go").href = url;
  location.replace(url);
</script>
</body>
</html>
